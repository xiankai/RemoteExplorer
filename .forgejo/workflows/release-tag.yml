name: release-tag
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    if: vars.ANDROID_CI_LOCAL != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tag master for a GitHub release
        shell: bash
        run: |
          set -euo pipefail
          auth=(-c "http.extraHeader=Authorization: token ${RUN_TOKEN}")
          git "${auth[@]}" clone --quiet --filter=blob:none --no-checkout --branch master \
            "https://forgejo.example.invalid/${GITHUB_REPOSITORY}.git" /tmp/repo
          cd /tmp/repo
          head=$(git rev-parse HEAD)
          if git tag --points-at "$head" | grep -q '^release-'; then
            echo "master ($head) is already tagged: $(git tag --points-at "$head" | grep '^release-')"
            exit 0
          fi
          previous=$(git tag --list 'release-*' --merged "$head" --sort=-creatordate | head -1)
          if [ -n "$previous" ]; then
            changed=$(git diff --name-only "$previous" "$head")
            if ! printf '%s\n' "$changed" | grep -qv '\.md$'; then
              echo "Only Markdown changed since $previous; no release."
              exit 0
            fi
          fi
          tag="release-$(git log -1 --format=%ct "$head")"
          git tag "$tag" "$head"
          git "${auth[@]}" push --quiet origin "refs/tags/$tag"
          echo "tagged $head as $tag; the push mirror carries it to GitHub, where release.yml publishes it"
        env:
          RUN_TOKEN: ${{ github.token }}
