# Pre-merge checks for the Android app.
#
# SECURITY MODEL (read before editing):
# - `pull_request`, NOT `pull_request_target`. This job executes PR-authored code — Gradle
#   runs whatever build logic the branch carries — so it must never hold a credential worth
#   stealing. The only secret is the ephemeral per-run `github.token`, unset from the git
#   config before any PR code runs. Do NOT add org Actions secrets here; review.yml is the
#   workflow that legitimately needs them, which is why it is author-gated.
# - One Action only: data.forgejo.org/actions/cache (Forgejo's own mirror), for the Gradle
#   cache. Action resolution on this instance was once unproven; clockwork-princess/
#   m5-stopwatch has used this exact action here since 2026-09-26. Nothing else is pulled in.
# - `push` to master runs this workflow too, but only to warm the shared cache (see CACHE).
#   Those runs build merged code, and a pull_request run can only ever write a cache private
#   to its own PR, so PR-authored build logic cannot replace what master (or publish.yml,
#   which holds the signing key) restores.
#
# CACHE: ~/.gradle/caches (dependencies, their transforms, the local build cache) and
# ~/.gradle/wrapper (the Gradle distribution), keyed on the files that decide what Gradle
# downloads. Without it every run re-resolved everything from scratch (~9 min median).
# A PR's cache is private to that PR; reads fall back to the shared copy that only a push
# run can write. So a push to master looks the key up first and stops in seconds when the
# shared copy exists, doing a full run only when the Gradle files change. PR runs then hit
# the shared copy on the exact key and never save. The runner keeps only the newest entry
# per key and drops anything unused for 7 days.
#
# WHAT IS DELIBERATELY NOT CHECKED HERE: the native build and the APK.
# externalNativeBuild needs NDK 27.2.12479018 plus cmake, which is several GB to install on
# a runner that has no layer cache between runs, on a pool of capacity 2. `assembleDebug` is
# already covered on a developer machine by tools/dev-run.sh before anything is pushed, and
# the arm64-only prebuilts mean CI could not run the result anyway. If the APK ever needs to
# be built here, give it its own runner label rather than putting a ten-minute job on the
# shared pool.
#
# -Prex.skipNative is what actually achieves that, and it is NOT optional. Checking the task
# graph is not enough: no CMake task enters the graph for lint or unit tests, but simply
# DECLARING externalNativeBuild makes AGP resolve ndkVersion at configuration time, so the
# first run of this workflow sat there downloading the NDK for tasks that compile no native
# code. Measured on `lintDebug --dry-run --info`: 76 NDK references without the flag, zero
# with it.
#
# One job rather than three: the android runner is capacity 1, so separate jobs would not run
# in parallel anyway — they would just mean a clone each and a queue behind one another. Each
# group runs even if an earlier one fails, so one push surfaces every finding instead of
# peeling them off one at a time.
name: build
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
    paths-ignore: ['**.md']

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # actions/cache runs inside the job container, which the gradle image ships without node.
  NODE_VERSION: v22.23.3
  # From https://nodejs.org/dist/v22.23.3/SHASUMS256.txt, checked against the download.
  NODE_SHA256: 1084aa36196bba4c3a5e69a1ee388a6e4ff729dad09445fbcd434b28fe3c24af

jobs:
  checks:
    # The DEDICATED Android runner (capacity 1), not the shared ubuntu-latest pool. This job
    # is ~8 minutes, mostly Gradle dependency resolution and Kotlin/KSP with no layer cache,
    # and the shared pool has two slots otherwise serving checks that take seconds — three
    # open PRs was enough to leave a build queued behind two others. Same split as ai-review.
    #
    # `android` is offered by exactly one runner, so if it is down builds QUEUE rather than
    # falling back. That is intended and, unlike a queued review, visible: a build has a run
    # page and the PR shows a pending check.
    #
    # See stacks/act-runner.yml in infra for the runner itself.
    runs-on: android
    container:
      image: gradle:9.1.0-jdk21
    # 40, not 25: a cold run was already ~20 min at worst, and one that misses the cache also
    # pays for compressing and saving it afterwards.
    timeout-minutes: 40
    steps:
      - name: Install node for the cache action
        run: |
          set -euo pipefail
          # The runner starts a JavaScript action with a bare `node` inside this container, so
          # a symlink on the default PATH is all it needs. .tar.gz because the image has no xz.
          curl -fsSL -o /tmp/node.tgz "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.gz"
          # Pinned checksum, so a swapped tarball fails here instead of running in this job.
          echo "${NODE_SHA256}  /tmp/node.tgz" | sha256sum -c -
          tar -xzf /tmp/node.tgz -C /opt
          ln -sf "/opt/node-${NODE_VERSION}-linux-x64/bin/node" /usr/local/bin/node
          node --version

      - name: Checkout
        run: |
          set -euo pipefail
          test -n "${RUN_TOKEN}" || { echo "::error::no ephemeral run token available to clone a private repo"; exit 1; }
          # Token via header, never in the clone URL (keeps it out of process listings).
          git config --global http.extraHeader "Authorization: token ${RUN_TOKEN}"
          git clone --quiet --no-tags --filter=blob:none \
            "https://forgejo.example.invalid/${GITHUB_REPOSITORY}.git" /tmp/repo
          if [ -n "${PR_NUMBER}" ]; then
            git -C /tmp/repo fetch --quiet origin "refs/pull/${PR_NUMBER}/head:refs/heads/pr-head"
            git -C /tmp/repo fetch --quiet origin "refs/heads/${BASE_REF}:refs/heads/pr-base"
            git -C /tmp/repo -c advice.detachedHead=false checkout --quiet pr-head
          else
            # Push to master: the pushed commit.
            git -C /tmp/repo -c advice.detachedHead=false checkout --quiet "${GITHUB_SHA}"
          fi
          # Drop the credential before any PR-authored code executes below.
          git config --global --unset-all http.extraHeader
        env:
          RUN_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Skip a Markdown-only change
        id: scope
        run: |
          set -euo pipefail
          cd /tmp/repo
          if [ -z "${PR_NUMBER}" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only pr-base...HEAD)
          if [ -z "$changed" ]; then
            echo "::warning::no files differ from ${BASE_REF}; running the full checks"
          fi
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '\.md$'; then
            echo "Only Markdown changed; nothing for shellcheck, unit tests or lint to read."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Gradle cache key
        id: key
        run: |
          set -euo pipefail
          cd /tmp/repo
          # hashFiles() only sees the workspace, and this job clones into /tmp/repo, so the key
          # is computed here: a hash over the files that decide what Gradle downloads.
          files=$(git ls-files 'gradle/libs.versions.toml' 'gradle/wrapper/gradle-wrapper.properties' \
                    '*.gradle' '*.gradle.kts')
          # A layout change that matched nothing would otherwise hash empty input into a
          # constant key that never changes again.
          [ -n "$files" ] || { echo "::error::no Gradle files matched for the cache key"; exit 1; }
          h=$(printf '%s\n' "$files" | xargs -d '\n' sha256sum | sha256sum | cut -c1-16)
          echo "key=gradle-build-${h}" >> "$GITHUB_OUTPUT"
          echo "gradle-build-${h}"

      # Push runs only. lookup-only downloads nothing and the restore-only action has no post
      # step, so this never saves. On a pull_request run it is skipped, its output is empty,
      # and every `if:` below is true.
      - name: Look up the shared Gradle cache
        id: shared
        if: github.event_name == 'push'
        uses: https://data.forgejo.org/actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Restore the Gradle cache
        if: steps.shared.outputs.cache-hit != 'true' && steps.scope.outputs.docs_only != 'true'
        # stack-reviewer-ignore: PR write scoping is enforced by the runner's cache proxy, which sets Forgejo-Cache-WriteIsolationKey itself for every PR run (act/cacheproxy/handler.go), and the server 403s any write outside it (act/artifactcache/handler.go); reading the shared copy is intended
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.key.outputs.key }}
          # A dependency bump still starts from the previous set rather than from nothing.
          restore-keys: |
            gradle-build-

      - name: Install shellcheck
        if: steps.shared.outputs.cache-hit != 'true' && steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends shellcheck unzip curl

      - name: Install the Android SDK
        if: steps.shared.outputs.cache-hit != 'true' && steps.scope.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          # Only what a non-native Gradle run needs. No NDK, no cmake — see the header.
          # Each substep announces itself: the first failure here was a bare exit 141 with
          # no output, because everything was redirected to /dev/null.
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          echo "downloading cmdline-tools"
          curl -fsSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          echo "unpacking"
          unzip -q /tmp/tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "accepting licences"
          # `yes` is killed by SIGPIPE the moment sdkmanager stops reading, and under
          # pipefail that surfaces as the step failing with exit 141 even though the
          # licences were accepted. Check sdkmanager's own status instead of the pipeline's.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          licences=${PIPESTATUS[1]}
          set -o pipefail
          [ "$licences" -eq 0 ] || { echo "::error::sdkmanager --licenses exited $licences"; exit 1; }

          echo "installing platform 37 + build-tools"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null  # stack-reviewer-ignore: 36.0.0 is AGP 9.4.1's own default build-tools (ToolsRevisionUtils in builder-9.4.1.jar), and compileSdk 37 builds with it — checked locally with only 36.0.0 installed. Build-tools does not track compileSdk.
          echo "sdk ready"
        env:
          ANDROID_HOME: /opt/android-sdk

      - name: Checks
        if: steps.shared.outputs.cache-hit != 'true' && steps.scope.outputs.docs_only != 'true'
        run: |
          set -uo pipefail
          cd /tmp/repo
          failed=0

          echo "::group::shellcheck (-S warning)"
          # The reviewer found a real quoting bug in tools/dev-seed-connection.sh on the very
          # PR that added it, so this is a proven class of breakage here, not a formality.
          git ls-files '*.sh' -z | xargs -0 --no-run-if-empty shellcheck -S warning || failed=1
          echo "::endgroup::"

          echo "::group::unit tests and lint"
          tasks=(testDebugUnitTest lintDebug)
          [ "${EVENT}" = push ] && tasks+=(mergeExtDexRelease)
          ./gradlew --no-daemon --continue -Prex.skipNative "${tasks[@]}" || failed=1
          echo "::endgroup::"

          echo "::group::gc"
          for log in /tmp/gc-*.log; do
            awk '/Pause/ { n++; ms += $NF + 0 } END { printf "%s: %d pauses, %.1f s paused\n", FILENAME, n, ms / 1000 }' "$log"
            tail -1 "$log"
          done
          echo "::endgroup::"

          exit "$failed"
        env:
          ANDROID_HOME: /opt/android-sdk
          EVENT: ${{ github.event_name }}
          GRADLE_OPTS: >-
            -Dorg.gradle.configuration-cache=false
            "-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Xlog:gc:file=/tmp/gc-%p.log"

      - name: Tidy the Gradle cache before it is saved
        # Runs before the cache action's post step, which is what saves. That post step only
        # saves on success and on a miss, so this matters only then, but it is cheap.
        if: steps.shared.outputs.cache-hit != 'true' && steps.scope.outputs.docs_only != 'true'
        run: |
          set -uo pipefail
          # Lock files and the gc marker would make a restored cache look busy or kick off a
          # cleanup on the next run.
          rm -f ~/.gradle/caches/modules-2/modules-2.lock ~/.gradle/caches/modules-2/gc.properties
          find ~/.gradle/caches -name '*.lock' -type f -delete 2>/dev/null || true
          du -sh ~/.gradle/caches ~/.gradle/wrapper 2>/dev/null || true

      - name: Lint report on failure
        if: failure()
        run: |
          set -euo pipefail
          report=/tmp/repo/app/build/reports/lint-results-debug.txt
          [ -f "$report" ] && tail -100 "$report" || echo "no lint report produced"
