# OBTAINIUM CAN ONLY READ THE RELEASES IF THIS REPO IS PUBLIC. Its Forgejo source (still
# named "Codeberg" in the app) has no token field, so a private repo's releases are invisible
# to it. That is a repo-visibility decision, not a CI one. The Firebase key in git history no
# longer argues against it: its project was shut down (#15).
#
# SECURITY MODEL: never `pull_request*`. This job holds the signing key, so it must never
# execute code from an unmerged branch: whatever starts it, the checkout refuses a commit
# that is not on master, which keeps a merge as the gate.
#
# THE NATIVE BUILD RUNS HERE, unlike build.yml. A release APK contains libffmpeg.so, so
# -Prex.skipNative would produce an APK that installs and then dies inside System.loadLibrary
# at the first video thumbnail. The NDK and cmake come from the android-ci image.
name: publish
on:
  push:
    tags: ['publish-*']
  schedule:
    - cron: 'CRON_TZ=Asia/Tokyo 0 12 * * *'  # stack-reviewer-ignore: Forgejo v16.0.5 (this instance) honours a TZ=/CRON_TZ= prefix in ActionScheduleSpec.Parse (models/actions/schedule_spec.go) and defaults to UTC without one
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

# GRADLE CACHE: RESTORE ONLY, never saved from here. This job holds the signing key, and
# AGP writes signing-config data (store and key passwords) into its intermediates, which the
# local build cache (org.gradle.caching=true, under ~/.gradle/caches) can keep. Anything this
# job saved would be readable by any PR run, since a PR can edit build.yml to restore any
# shared key. So it only reads build.yml's shared copy (same key, same files), which covers
# most dependencies; the release- and native-only extras are still downloaded each time.

jobs:
  publish:
    if: vars.ANDROID_CI_LOCAL == '1'
    runs-on: android
    container:
      image: ${{ vars.ANDROID_CI_IMAGE }}  # stack-reviewer-ignore: the registry's android-ci:live, pushed to the registry from a reviewed Dockerfile and moved to :live only by a promotion after a reviewed merge; the runner has no registry login and runs the copy the android-ci stack keeps on the host, so :live carries the same trust as the old local tag and a digest pin would add a manual bump per promotion without narrowing who controls the job
    timeout-minutes: 45
    steps:
      - name: Checkout the commit that was asked for, if it is on master
        id: checkout
        run: |
          set -euo pipefail
          test -n "${RUN_TOKEN}" || { echo "::error::no ephemeral run token available"; exit 1; }
          git config --global http.extraHeader "Authorization: token ${RUN_TOKEN}"
          git clone --quiet --no-tags --filter=blob:none --branch master \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" /tmp/repo
          git -C /tmp/repo fetch --quiet origin "+${GITHUB_REF}:refs/publish/trigger"  # stack-reviewer-ignore: the destination is refs/publish/trigger, not a branch, so git's "refusing to fetch into checked-out branch" guard does not apply; reproduced locally for refs/heads/master (dispatch) and refs/tags/publish-* (tag): clone --branch master, this fetch, checkout ^{commit} and the ancestor check all pass
          git config --global --unset-all http.extraHeader
          cd /tmp/repo
          git -c advice.detachedHead=false checkout --quiet 'refs/publish/trigger^{commit}'
          commit=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$commit" origin/master || {
            echo "::error::${GITHUB_REF} points at ${commit}, which is not on master. Merge it first, then tag the merge."
            exit 1
          }
          echo "PUBLISH_SHA=${commit}" >> "$GITHUB_ENV"
          if [ "${GITHUB_EVENT_NAME}" = schedule ]; then
            released=$(curl -fsS -H "Authorization: token ${RUN_TOKEN}" \
              "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases?limit=50" \
              | jq -r 'sort_by(.id) | last | .target_commitish // ""')
            if [ "$released" = "$commit" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "master is still ${commit}, the newest release; nothing to publish today"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "publishing ${commit} ($(git log -1 --format=%s))"
        env:
          RUN_TOKEN: ${{ github.token }}

      - name: Gradle cache key
        if: steps.checkout.outputs.publish == 'true'
        id: key
        run: |
          set -euo pipefail
          cd /tmp/repo
          # Computed here rather than with hashFiles(), which only sees the workspace.
          files=$(git ls-files 'gradle/libs.versions.toml' 'gradle/wrapper/gradle-wrapper.properties' \
                    '*.gradle' '*.gradle.kts')
          # A layout change that matched nothing would otherwise hash empty input into a
          # constant key that never changes again.
          [ -n "$files" ] || { echo "::error::no Gradle files matched for the cache key"; exit 1; }
          h=$(printf '%s\n' "$files" | xargs -d '\n' sha256sum | sha256sum | cut -c1-16)
          echo "key=gradle-build-${h}" >> "$GITHUB_OUTPUT"
          echo "gradle-build-${h}"

      - name: Restore the Gradle cache
        if: steps.checkout.outputs.publish == 'true'
        # restore/ has no post step, so nothing from this job is ever saved (see header).
        uses: https://data.forgejo.org/actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.key.outputs.key }}
          restore-keys: |
            gradle-build-

      - name: Restore the signing material
        if: steps.checkout.outputs.publish == 'true'
        run: |
          set -euo pipefail
          # Fail here, loudly, rather than later and quietly. Release signing is OPTIONAL in
          # app/build.gradle.kts by design (a plain clone must still build `debug`), which
          # means assembleRelease without a keystore SUCCEEDS and emits
          # app-release-unsigned.apk — an APK that cannot be installed. A publish job must
          # never reach that state silently.
          test -n "${KEYSTORE_B64}" || { echo "::error::SIDELOAD_KEYSTORE_BASE64 is not set — see .forgejo/workflows/publish.yml"; exit 1; }
          test -n "${KEYSTORE_PROPS}" || { echo "::error::SIDELOAD_KEYSTORE_PROPERTIES is not set"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/repo/app/remote_explorer_keystore.jks
          printf '%s\n' "$KEYSTORE_PROPS" > /tmp/repo/keystore.properties
        env:
          KEYSTORE_B64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PROPS: ${{ secrets.SIDELOAD_KEYSTORE_PROPERTIES }}

      - name: Build the release APK
        if: steps.checkout.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cd /tmp/repo
          ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process assembleRelease -x lintVitalRelease
        env:
          ANDROID_HOME: /opt/android-sdk
          GRADLE_OPTS: -Dorg.gradle.configuration-cache=false -Dorg.gradle.jvmargs=-Xmx2g


      - name: Verify the APK is actually signed
        if: steps.checkout.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cd /tmp/repo
          # AGP names the output app-release-UNSIGNED.apk when no signing config applied, so
          # the filename alone catches the failure — but check the signature properly too,
          # because "a file exists" is not the property that matters. Verified locally that
          # an unsigned build produces exactly this name and that apksigner reports
          # "DOES NOT VERIFY / Missing META-INF/MANIFEST.MF" for it.
          apk=app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || {
            echo "::error::$apk missing — outputs were: $(ls app/build/outputs/apk/release/)"
            exit 1
          }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk" \
            | tee /tmp/verify.txt
          grep -q "^Verifies$" /tmp/verify.txt || { echo "::error::apksigner did not verify the APK"; exit 1; }
          echo "signed ok: $(du -h "$apk" | cut -f1)"
        env:
          ANDROID_HOME: /opt/android-sdk

      - name: Read the version, and refuse to go backwards
        if: steps.checkout.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cd /tmp/repo
          apk=app/build/outputs/apk/release/app-release.apk
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          # NO `| head -1` HERE, and no pipe into awk either. aapt2 keeps writing after the
          # first line, so a reader that exits early kills it with SIGPIPE, the pipeline
          # returns 141 under `set -o pipefail`, and the step fails with a signed APK already
          # published — which is exactly how run 67 failed. Capturing the whole (few-KB) output and feeding awk a
          # here-string leaves no pipe for an early `exit` to break.
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk")
          code=$(awk -F"'" '/^package:/ { for (i = 1; i < NF; i++) if ($i ~ /versionCode=$/) { print $(i + 1); exit } }' <<<"$badging")  # stack-reviewer-ignore: awk matches substrings, so the leading space does not defeat the end anchor — verified against real aapt2 output
          name=$(awk -F"'" '/^package:/ { for (i = 1; i < NF; i++) if ($i ~ /versionName=$/) { print $(i + 1); exit } }' <<<"$badging")  # stack-reviewer-ignore: same substring-match reasoning as versionCode above
          [ -n "$code" ] && [ -n "$name" ] || { echo "::error::could not read versionCode/versionName from $apk"; exit 1; }

          newest=$(curl -fsS -H "Authorization: token ${RUN_TOKEN}" "$api/releases?limit=50" \
            | jq -r '[.[].tag_name | select(test("^v[0-9]+$")) | ltrimstr("v") | tonumber] | max // 0')
          if [ "$code" -lt "$newest" ]; then
            echo "::error::versionCode $code is older than the newest release v$newest, so it would not install over it. Publish a commit at or after that release."
            exit 1
          fi
          {
            echo "VERSION_CODE=${code}"
            echo "VERSION_NAME=${name}"
          } >> "$GITHUB_ENV"
          echo "versionCode $code ($name), newest release v$newest"
        env:
          RUN_TOKEN: ${{ github.token }}
          ANDROID_HOME: /opt/android-sdk

      - name: Upload to the sideload file server, replacing the previous copy
        if: steps.checkout.outputs.publish == 'true'
        run: |
          set -euo pipefail
          [ -n "${UPLOAD_URL}" ] || { echo "::error::the SIDELOAD_UPLOAD_URL repo variable is not set; it must be the full URL of the APK on the sideload file server"; exit 1; }
          cd /tmp/repo
          apk=app/build/outputs/apk/release/app-release.apk
          staging="${UPLOAD_URL}.upload"
          want=$(stat -c %s "$apk")
          code=$(curl -sS -o /dev/null -w '%{http_code}' -T "$apk" "$staging")
          case "$code" in
            2*) ;;
            *)  echo "::error::sideload upload failed with HTTP $code"; exit 1 ;;
          esac
          got=$(curl -sSI "$staging" | awk -F': ' 'tolower($1) == "content-length" { print $2 + 0 }')
          [ "$got" = "$want" ] || { echo "::error::the server holds $got bytes of a $want-byte APK; the live copy was left alone"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X MOVE -H "Destination: ${UPLOAD_URL}" -H 'Overwrite: T' "$staging")
          case "$code" in
            2*) echo "uploaded to $UPLOAD_URL ($want bytes)" ;;
            *)  echo "::error::moving the upload into place failed with HTTP $code"; exit 1 ;;
          esac
        env:
          UPLOAD_URL: ${{ vars.SIDELOAD_UPLOAD_URL }}

      - name: Publish a release, keeping only the latest three
        if: steps.checkout.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cd /tmp/repo
          apk=app/build/outputs/apk/release/app-release.apk
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"

          tag="v${VERSION_CODE}"

          existing=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: token ${RUN_TOKEN}" "$api/releases/tags/${tag}")
          case "$existing" in
            200)
              echo "replacing the existing release $tag"
              curl -fsS -X DELETE -H "Authorization: token ${RUN_TOKEN}" "$api/releases/tags/${tag}"
              gone=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: token ${RUN_TOKEN}" "$api/tags/${tag}")
              case "$gone" in
                204) ;;
                404) echo "tag $tag was already gone" ;;
                *) echo "::error::deleting tag $tag returned HTTP $gone"; exit 1 ;;
              esac
              ;;
            404) ;;
            *) echo "::error::looking up release $tag returned HTTP $existing"; exit 1 ;;
          esac

          payload=$(jq -n --arg tag "$tag" --arg target "$PUBLISH_SHA" --arg name "$VERSION_NAME" \
                       --arg body "$(git log -1 --pretty='%s%n%n%H')" \
                       '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: false, prerelease: false}')
          id=$(curl -fsS -X POST -H "Authorization: token ${RUN_TOKEN}" -H 'Content-Type: application/json' --data "$payload" "$api/releases" | jq -r '.id')  # stack-reviewer-ignore: a re-run of the same commit mints the same tag, and the lookup above removes that release and tag first; the `publish` concurrency group serialises runs, so nothing recreates it in between
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::release creation returned no id"; exit 1; }

          curl -fsS -X POST -H "Authorization: token ${RUN_TOKEN}" \
            -F "attachment=@${apk};type=application/vnd.android.package-archive" \
            "$api/releases/${id}/assets?name=remote-explorer.apk" >/dev/null
          echo "released $tag ($VERSION_NAME)"

          # Keep three. Deleting a release takes its attachment with it, which is the point:
          # each APK is ~85 MB. The tag has to go separately, or
          # the ref list grows without bound behind releases that no longer exist. Sorted by
          # id rather than trusting list order, because newest-first is the API's default
          # rather than a guarantee.
          curl -fsS -H "Authorization: token ${RUN_TOKEN}" "$api/releases?limit=50" \
            | jq -r 'sort_by(.id) | reverse | .[3:][] | "\(.id) \(.tag_name)"' \
            | while read -r old_id old_tag; do
                echo "pruning $old_tag"
                curl -fsS -X DELETE -H "Authorization: token ${RUN_TOKEN}" "$api/releases/${old_id}"
                # The release is the destructive half and has already happened by here, so a
                # failure to remove its tag must not fail the job — the APK is published and
                # the storage is reclaimed either way. Forgejo may also have taken the tag
                # with the release, which would make this a 404.
                curl -fsS -X DELETE -H "Authorization: token ${RUN_TOKEN}" "$api/tags/${old_tag}" \
                  || echo "tag $old_tag was already gone"
              done
        env:
          RUN_TOKEN: ${{ github.token }}
