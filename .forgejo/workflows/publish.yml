# Publish a signed release APK to the self-hosted file server, for sideloading via Obtainium,
# and record it as a Forgejo release.
#
# TWO DESTINATIONS, DELIBERATELY DIFFERENT SHAPES. fileserver holds ONE COPY, ALWAYS OVERWRITTEN:
# a fixed URL with no version in the name, because the tablet installs from it and a stable
# URL is the whole point. Forgejo keeps the LATEST THREE releases, because a list of what
# shipped when is worth something to a human and three is enough to answer "did the last
# build break it" without unbounded storage. Neither is a backup of the other; the fileserver copy
# is the one the tablet consumes, and it is uploaded first so a release failure cannot keep
# a working APK away from it.
#
# OBTAINIUM CAN ONLY READ THE RELEASES IF THIS REPO IS PUBLIC. Its Forgejo source (still
# named "Codeberg" in the app) has no token field, so a private repo's releases are invisible
# to it. That is a repo-visibility decision, not a CI one — see issue #15 before flipping it,
# since the Firebase key in git history was accepted on the premise that this repo is private.
#
# WHY THIS RUNS HERE AND NOT ON GITHUB. fileserver is published at
# files.example.invalid, a TAILNET host, so a GitHub-hosted runner cannot
# reach it. The Forgejo runner is on the self-hosted and can. That is the whole reason this is a
# second pipeline rather than a step bolted onto the existing GitHub release job.
#
# SECURITY MODEL: `push` to the default branch only, never `pull_request*`. This job holds
# the signing key, so it must never execute code from an unmerged branch. It is not
# author-gated like review.yml because only a merge can trigger it, and a merge is already
# the gate.
#
# THE NDK IS UNAVOIDABLE HERE, unlike build.yml. A release APK contains libffmpeg.so, so the
# native build genuinely has to run — -Prex.skipNative would produce an APK that installs and
# then dies inside System.loadLibrary at the first video thumbnail. That makes this job
# several GB heavier than the PR check; it is why this triggers on merge rather than on every
# push to a branch.
name: publish
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: publish
  # NOT cancel-in-progress, unlike review.yml. That file can cancel safely because the
  # reviewer publishes atomically in a single request; this job streams an APK over ~100 MB
  # into a fixed path with PUT, so a SIGKILL partway leaves a TRUNCATED file at the URL the
  # tablet installs from — a corrupt artifact that looks like a successful publish. Queueing
  # costs a few minutes; the alternative costs a broken install.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: android
    container:
      image: gradle:9.1.0-jdk21
    timeout-minutes: 45
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          test -n "${RUN_TOKEN}" || { echo "::error::no ephemeral run token available"; exit 1; }
          git config --global http.extraHeader "Authorization: token ${RUN_TOKEN}"
          git clone --quiet --no-tags --depth 1 --branch master \
            "https://forgejo.example.invalid/${GITHUB_REPOSITORY}.git" /tmp/repo
          git config --global --unset-all http.extraHeader
        env:
          RUN_TOKEN: ${{ github.token }}

      - name: Restore the signing material
        run: |
          set -euo pipefail
          # Fail here, loudly, rather than later and quietly. Release signing is OPTIONAL in
          # app/build.gradle.kts by design (a plain clone must still build `debug`), which
          # means assembleRelease without a keystore SUCCEEDS and emits
          # app-release-unsigned.apk — an APK that cannot be installed. A publish job must
          # never reach that state silently.
          test -n "${KEYSTORE_B64}" || { echo "::error::SIDELOAD_KEYSTORE_BASE64 is not set — see .forgejo/workflows/publish.yml"; exit 1; }
          test -n "${KEYSTORE_PROPS}" || { echo "::error::SIDELOAD_KEYSTORE_PROPERTIES is not set"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/repo/app/remote_explorer_keystore.jks
          printf '%s\n' "$KEYSTORE_PROPS" > /tmp/repo/keystore.properties
        env:
          KEYSTORE_B64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PROPS: ${{ secrets.SIDELOAD_KEYSTORE_PROPERTIES }}

      - name: Install the Android SDK and NDK
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends unzip curl jq
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          echo "downloading cmdline-tools"
          curl -fsSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "accepting licences"
          # `yes` dies of SIGPIPE once sdkmanager stops reading; under pipefail that would
          # fail the step with 141 despite the licences being accepted. Same guard as build.yml.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          licences=${PIPESTATUS[1]}
          set -o pipefail
          [ "$licences" -eq 0 ] || { echo "::error::sdkmanager --licenses exited $licences"; exit 1; }
          # ndk + cmake versions must match app/build.gradle.kts exactly.
          echo "installing platform 36, build-tools, ndk and cmake (several GB, no layer cache)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1" >/dev/null
          echo "sdk ready"
        env:
          ANDROID_HOME: /opt/android-sdk

      - name: Build the release APK
        run: |
          set -euo pipefail
          cd /tmp/repo
          # No -Prex.skipNative: the whole point of this artifact is that it contains the
          # native library.
          ./gradlew --no-daemon assembleRelease
        env:
          ANDROID_HOME: /opt/android-sdk
          GRADLE_OPTS: -Dorg.gradle.configuration-cache=false

      - name: Verify the APK is actually signed
        run: |
          set -euo pipefail
          cd /tmp/repo
          # AGP names the output app-release-UNSIGNED.apk when no signing config applied, so
          # the filename alone catches the failure — but check the signature properly too,
          # because "a file exists" is not the property that matters. Verified locally that
          # an unsigned build produces exactly this name and that apksigner reports
          # "DOES NOT VERIFY / Missing META-INF/MANIFEST.MF" for it.
          apk=app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || {
            echo "::error::$apk missing — outputs were: $(ls app/build/outputs/apk/release/)"
            exit 1
          }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk" \
            | tee /tmp/verify.txt
          grep -q "^Verifies$" /tmp/verify.txt || { echo "::error::apksigner did not verify the APK"; exit 1; }
          echo "signed ok: $(du -h "$apk" | cut -f1)"
        env:
          ANDROID_HOME: /opt/android-sdk

      - name: Upload to fileserver, replacing the previous copy
        run: |
          set -euo pipefail
          cd /tmp/repo
          apk=app/build/outputs/apk/release/app-release.apk
          # fileserver runs with -A (all operations allowed) and no auth, reachable only on the
          # tailnet. PUT to a fixed path overwrites in place — that IS the "one copy" rule,
          # not a cleanup step that could fail and leave two.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -T "$apk" "$FILESERVER_URL")
          case "$code" in
            2*) echo "uploaded to $FILESERVER_URL (HTTP $code)" ;;
            *)  echo "::error::fileserver upload failed with HTTP $code"; exit 1 ;;
          esac
        env:
          FILESERVER_URL: https://files.example.invalid/apps/remote-explorer.apk

      - name: Publish a release, keeping only the latest three
        run: |
          set -euo pipefail
          cd /tmp/repo
          apk=app/build/outputs/apk/release/app-release.apk
          api="https://forgejo.example.invalid/api/v1/repos/${GITHUB_REPOSITORY}"

          # The tag is read back OUT OF THE APK rather than taken from the clock, so it can
          # never describe a different build than the one being attached. versionCode is
          # Instant.now().epochSecond (app/build.gradle.kts), so it is unique and monotonic;
          # versionName is `yyyy-MM-dd HH:mm:ss`, whose space and colons git forbids in a ref,
          # so that stays in the release title where it is readable.
          # NO `| head -1` HERE, and no pipe into awk either. aapt2 keeps writing after the
          # first line, so a reader that exits early kills it with SIGPIPE, the pipeline
          # returns 141 under `set -o pipefail`, and the step fails with a signed APK already
          # published — which is exactly how run 67 failed. The same trap is documented above
          # for `yes | sdkmanager`. Capturing the whole (few-KB) output and feeding awk a
          # here-string leaves no pipe for an early `exit` to break.
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk")
          # The regexes below are ANCHORED AT THE END ONLY, on purpose: an awk regex matches a
          # substring, so ` versionCode=` (field 3 carries aapt2's separating space) matches
          # /versionCode=$/ while `compileSdkVersionCodename=` does not. Anchoring the end is
          # what guarantees the NEXT field is the value rather than something further along.
          code=$(awk -F"'" '/^package:/ { for (i = 1; i < NF; i++) if ($i ~ /versionCode=$/) { print $(i + 1); exit } }' <<<"$badging")  # stack-reviewer-ignore: awk matches substrings, so the leading space does not defeat the end anchor — verified against real aapt2 output
          name=$(awk -F"'" '/^package:/ { for (i = 1; i < NF; i++) if ($i ~ /versionName=$/) { print $(i + 1); exit } }' <<<"$badging")  # stack-reviewer-ignore: same substring-match reasoning as versionCode above
          [ -n "$code" ] && [ -n "$name" ] || { echo "::error::could not read versionCode/versionName from $apk"; exit 1; }
          tag="v${code}"

          payload=$(jq -n --arg tag "$tag" --arg target "$GITHUB_SHA" --arg name "$name" \
                       --arg body "$(git log -1 --pretty='%s%n%n%H')" \
                       '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: false, prerelease: false}')
          id=$(curl -fsS -X POST -H "Authorization: token ${RUN_TOKEN}" -H 'Content-Type: application/json' --data "$payload" "$api/releases" | jq -r '.id')  # stack-reviewer-ignore: a duplicate tag cannot arise — a re-run rebuilds, versionCode is Instant.now().epochSecond, and the `publish` concurrency group serialises runs, so every attempt mints a fresh tag
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::release creation returned no id"; exit 1; }

          curl -fsS -X POST -H "Authorization: token ${RUN_TOKEN}" \
            -F "attachment=@${apk};type=application/vnd.android.package-archive" \
            "$api/releases/${id}/assets?name=remote-explorer.apk" >/dev/null
          echo "released $tag ($name)"

          # Keep three. Deleting a release takes its attachment with it, which is the point:
          # each APK is ~85 MB and this runs on every merge. The tag has to go separately, or
          # the ref list grows without bound behind releases that no longer exist. Sorted by
          # id rather than trusting list order, because newest-first is the API's default
          # rather than a guarantee.
          curl -fsS -H "Authorization: token ${RUN_TOKEN}" "$api/releases?limit=50" \
            | jq -r 'sort_by(.id) | reverse | .[3:][] | "\(.id) \(.tag_name)"' \
            | while read -r old_id old_tag; do
                echo "pruning $old_tag"
                curl -fsS -X DELETE -H "Authorization: token ${RUN_TOKEN}" "$api/releases/${old_id}"
                # The release is the destructive half and has already happened by here, so a
                # failure to remove its tag must not fail the job — the APK is published and
                # the storage is reclaimed either way. Forgejo may also have taken the tag
                # with the release, which would make this a 404.
                curl -fsS -X DELETE -H "Authorization: token ${RUN_TOKEN}" "$api/tags/${old_tag}" \
                  || echo "tag $old_tag was already gone"
              done
        env:
          RUN_TOKEN: ${{ github.token }}
          ANDROID_HOME: /opt/android-sdk
